<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍀 Lucky Clover Study Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f2f7f4;
      --card-bg: #ffffff;
      --primary: #52796f;
      --primary-hover: #354f52;
      --accent-high: #e76f51;
      --accent-med: #e9c46a;
      --accent-low: #84a98c;
      --text: #2f3e46;
      --line-color: #d1e3d7;
      --border-radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 850px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .group-banner {
      background: #cad2c5;
      padding: 1rem 1.5rem;
      border-radius: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      border: 2px dashed var(--primary);
    }

    .group-info {
      font-weight: 700;
      color: var(--primary-hover);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .code-badge {
      background: var(--card-bg);
      padding: 0.3rem 0.8rem;
      border-radius: 10px;
      letter-spacing: 2px;
      font-family: 'Fredoka One', cursive;
      color: var(--primary);
      border: 1px solid var(--primary);
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-low);
      display: inline-block;
      transition: background 0.2s ease;
    }
    .sync-dot.syncing { background: var(--accent-med); animation: pulse 0.8s infinite; }
    .sync-dot.error { background: var(--accent-high); }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

    header {
      text-align: center;
      background: var(--card-bg);
      padding: 2rem;
      border-radius: var(--border-radius);
      box-shadow: 0 8px 20px rgba(82, 121, 111, 0.12);
      border: 2px solid #cad2c5;
    }

    header h1 {
      font-family: 'Fredoka One', cursive;
      color: var(--primary);
      font-size: 2.3rem;
    }

    header p.subtitle {
      color: #6b7d76;
      margin-top: 0.3rem;
      font-weight: 600;
    }

    .progress-container {
      background: #e9f5ed;
      border-radius: 10px;
      height: 12px;
      width: 100%;
      margin-top: 1rem;
      overflow: hidden;
    }

    .progress-bar {
      background: var(--primary);
      height: 100%;
      width: 0%;
      transition: width 0.4s ease;
    }

    .progress-label {
      font-size: 0.8rem;
      color: #6b7d76;
      margin-top: 0.4rem;
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: var(--border-radius);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.03);
      border: 2px solid #cad2c5;
    }

    .card h2 {
      font-family: 'Fredoka One', cursive;
      color: var(--primary);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 1.3rem;
    }

    .count-pill {
      background: var(--bg);
      color: var(--primary);
      font-size: 0.75rem;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      padding: 0.15rem 0.6rem;
      border-radius: 20px;
      border: 1px solid var(--line-color);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.2rem;
    }

    input, select, button {
      padding: 0.8rem 1rem;
      border-radius: 12px;
      border: 2px solid #cad2c5;
      outline: none;
      font-size: 0.95rem;
      background: white;
      color: var(--text);
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    button {
      background-color: var(--primary);
      color: white;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    button.secondary {
      background: var(--card-bg);
      color: var(--primary);
      border: 2px solid var(--primary);
    }
    button.secondary:hover {
      background: var(--bg);
      color: var(--primary-hover);
    }

    .lined-notebook {
      background-color: white;
      background-image: linear-gradient(var(--line-color) 1px, transparent 1px);
      background-size: 100% 45px;
      padding: 0.2rem 0;
      border-left: 3px solid #ffb703;
      padding-left: 0.8rem;
      min-height: 45px;
    }

    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
    }

    .todo-item {
      min-height: 45px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-right: 0.5rem;
      gap: 0.5rem;
    }

    .todo-left {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      min-width: 0;
    }

    .task-text {
      overflow-wrap: anywhere;
    }

    .custom-checkbox {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid var(--primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      flex-shrink: 0;
    }

    .todo-item.completed .custom-checkbox {
      background: var(--primary);
    }

    .todo-item.completed .custom-checkbox::after {
      content: "✓";
      color: white;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .todo-item.completed .task-text {
      text-decoration: line-through;
      color: #a0aab0;
    }

    .badge {
      font-size: 0.65rem;
      padding: 0.2rem 0.5rem;
      border-radius: 12px;
      color: white;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .priority-High { background-color: var(--accent-high); }
    .priority-Medium { background-color: var(--accent-med); color: #5c4a1a; }
    .priority-Low { background-color: var(--accent-low); }
    .badge.countdown-today { background-color: var(--accent-high); }
    .badge.countdown-soon { background-color: var(--accent-med); color: #5c4a1a; }
    .badge.countdown-later { background-color: var(--accent-low); }
    .badge.countdown-past { background-color: #b0b8b4; }

    .delete-btn {
      background: transparent;
      color: #bbb;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      color: var(--accent-high);
    }

    .empty-state {
      padding: 1rem 0.2rem;
      color: #8a9691;
      font-style: italic;
      font-size: 0.9rem;
    }

    .banner-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .banner-actions input {
      width: 140px;
      padding: 0.5rem 0.8rem;
    }

    .banner-actions button {
      padding: 0.5rem 0.9rem;
      font-size: 0.85rem;
    }

    .status-line {
      font-size: 0.72rem;
      color: #8a9691;
      margin-top: 0.5rem;
      text-align: center;
    }

    @media (max-width: 480px) {
      .banner-actions input { width: 110px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="group-banner">
    <div class="group-info">
      <span class="sync-dot" id="syncDot"></span>
      👥 Group Code: <span id="currentGroupDisplay" class="code-badge">----</span>
    </div>
    <div class="banner-actions">
      <input type="text" id="groupCodeInput" placeholder="Enter code">
      <button class="secondary" onclick="joinGroup()">Join Group ☘️</button>
      <button onclick="createGroup()">New Code ➕</button>
    </div>
  </div>

  <header>
    <h1>🍀 Lucky Clover Notebook 🍀</h1>
    <p class="subtitle">Share your study notebook with friends — everyone in the same group code sees the same list.</p>
    <div class="progress-container">
      <div id="progressBar" class="progress-bar"></div>
    </div>
    <div class="progress-label" id="progressLabel">No tasks yet</div>
  </header>

  <div class="grid">
    <div class="card">
      <h2>📌 Notebook Tasks <span class="count-pill" id="taskCount">0</span></h2>
      <div class="input-group">
        <input type="text" id="taskInput" placeholder="Write on a line..." maxlength="140">
        <select id="priorityInput">
          <option value="High">🔥 High Priority (Do First!)</option>
          <option value="Medium" selected>☘️ Medium Priority (Do Next)</option>
          <option value="Low">☁️ Low Priority (Optional)</option>
        </select>
        <button onclick="addTask()">Add Task 📝</button>
      </div>

      <div class="lined-notebook">
        <ul id="taskList" class="todo-list"></ul>
      </div>
    </div>

    <div class="card">
      <h2>🗓️ Exam Calendar <span class="count-pill" id="examCount">0</span></h2>
      <div class="input-group">
        <input type="text" id="examSubject" placeholder="Subject (e.g., History Exam)" maxlength="80">
        <input type="date" id="examDate">
        <button onclick="addExam()">Add Exam 📅</button>
      </div>

      <div class="lined-notebook">
        <ul id="examList" class="todo-list"></ul>
      </div>
    </div>
  </div>

  <div class="status-line" id="statusLine">Loading your group's notebook...</div>
</div>

<script>
  // ---- Group is a personal setting: which shared notebook you're viewing ----
  // ---- Tasks/exams are SHARED per group code, so everyone with the code sees the same list ----

  let activeGroup = '1234';
  let tasks = [];
  let exams = [];

  const syncDot = document.getElementById('syncDot');
  const statusLine = document.getElementById('statusLine');

  function setSync(state, msg) {
    syncDot.className = `sync-dot ${state === 'syncing' ? 'syncing' : state === 'error' ? 'error' : ''}`;
    if (msg) statusLine.textContent = msg;
  }

  const presetSeed = {
    '1234': {
      tasks: [
        { text: 'Math Ch. 4 Exercises (Alex)', priority: 'High', completed: false, id: 1 },
        { text: 'Read Bio Ch. 2 (Sam)', priority: 'Medium', completed: true, id: 2 },
        { text: 'Review Chemistry Flashcards', priority: 'High', completed: false, id: 3 }
      ],
      exams: [
        { subject: 'Math Midterm', date: '2026-09-01', id: 101 },
        { subject: 'Biology Quiz', date: '2026-08-25', id: 102 }
      ]
    }
  };

  async function init() {
    setSync('syncing', 'Loading your group\'s notebook...');
    try {
      const savedGroup = await window.storage.get('active-group', false);
      if (savedGroup && savedGroup.value) activeGroup = savedGroup.value;
    } catch (e) {
      // no saved group yet — stick with default
    }
    updateGroupUI();
    await loadGroupData();
  }

  async function loadGroupData() {
    setSync('syncing', 'Syncing group notebook...');
    try {
      let loadedTasks = null;
      let loadedExams = null;

      try {
        const t = await window.storage.get(`tasks:${activeGroup}`, true);
        loadedTasks = t ? JSON.parse(t.value) : null;
      } catch (e) { loadedTasks = null; }

      try {
        const ex = await window.storage.get(`exams:${activeGroup}`, true);
        loadedExams = ex ? JSON.parse(ex.value) : null;
      } catch (e) { loadedExams = null; }

      if (loadedTasks === null && presetSeed[activeGroup]) {
        loadedTasks = presetSeed[activeGroup].tasks;
        loadedExams = presetSeed[activeGroup].exams;
        await saveTasks(loadedTasks, false);
        await saveExams(loadedExams, false);
      }

      tasks = loadedTasks || [];
      exams = loadedExams || [];

      setSync('ok', `Synced with group ${activeGroup}. This notebook is shared with anyone who joins the same code.`);
    } catch (e) {
      tasks = [];
      exams = [];
      setSync('error', 'Could not load this group\'s notebook. Try again or check your connection.');
    }
    renderTasks();
    renderExams();
  }

  // ---- GROUP LOGIC ----
  async function createGroup() {
    const newCode = Math.floor(1000 + Math.random() * 9000).toString();
    activeGroup = newCode;
    setSync('syncing', 'Creating new group...');
    try {
      await window.storage.set('active-group', activeGroup, false);
    } catch (e) { /* non-fatal, we still switch locally */ }
    updateGroupUI();
    tasks = [];
    exams = [];
    renderTasks();
    renderExams();
    setSync('ok', `New group created: ${activeGroup}. Share this code with friends so they can join!`);
  }

  async function joinGroup() {
    const inputEl = document.getElementById('groupCodeInput');
    const inputCode = inputEl.value.trim();
    if (!inputCode) return;

    activeGroup = inputCode;
    setSync('syncing', `Joining group ${activeGroup}...`);
    try {
      await window.storage.set('active-group', activeGroup, false);
    } catch (e) { /* non-fatal */ }
    inputEl.value = '';
    updateGroupUI();
    await loadGroupData();
  }

  function updateGroupUI() {
    document.getElementById('currentGroupDisplay').innerText = activeGroup;
  }

  // ---- STORAGE HELPERS (shared = everyone in this group sees it) ----
  async function saveTasks(list, updateUi = true) {
    tasks = list;
    if (updateUi) renderTasks();
    try {
      await window.storage.set(`tasks:${activeGroup}`, JSON.stringify(tasks), true);
    } catch (e) {
      setSync('error', 'Could not save that change. Check your connection and try again.');
    }
  }

  async function saveExams(list, updateUi = true) {
    exams = list;
    if (updateUi) renderExams();
    try {
      await window.storage.set(`exams:${activeGroup}`, JSON.stringify(exams), true);
    } catch (e) {
      setSync('error', 'Could not save that exam. Check your connection and try again.');
    }
  }

  // ---- TASK LOGIC ----
  async function addTask() {
    const input = document.getElementById('taskInput');
    const taskText = input.value.trim();
    const priority = document.getElementById('priorityInput').value;
    if (!taskText) return;

    const order = { High: 1, Medium: 2, Low: 3 };
    const newTasks = [...tasks, { text: taskText, priority, completed: false, id: Date.now() }]
      .sort((a, b) => order[a.priority] - order[b.priority]);

    input.value = '';
    await saveTasks(newTasks);
  }

  function renderTasks() {
    const taskList = document.getElementById('taskList');
    taskList.innerHTML = '';
    document.getElementById('taskCount').textContent = tasks.length;

    if (tasks.length === 0) {
      taskList.innerHTML = `<li class="empty-state">No tasks yet — add the first one above! ☘️</li>`;
    }

    let completedCount = 0;

    tasks.forEach(task => {
      if (task.completed) completedCount++;

      const li = document.createElement('li');
      li.className = `todo-item ${task.completed ? 'completed' : ''}`;
      li.innerHTML = `
        <div class="todo-left">
          <div class="custom-checkbox" onclick="toggleTask(${task.id})"></div>
          <span class="task-text">${escapeHtml(task.text)}</span>
          <span class="badge priority-${task.priority}">${task.priority}</span>
        </div>
        <button class="delete-btn" onclick="deleteTask(${task.id})" aria-label="Delete task">✖</button>
      `;
      taskList.appendChild(li);
    });

    const progress = tasks.length ? (completedCount / tasks.length) * 100 : 0;
    document.getElementById('progressBar').style.width = `${progress}%`;
    document.getElementById('progressLabel').textContent = tasks.length
      ? `${completedCount} of ${tasks.length} tasks done`
      : 'No tasks yet';
  }

  async function toggleTask(id) {
    const newTasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
    await saveTasks(newTasks);
  }

  async function deleteTask(id) {
    const newTasks = tasks.filter(t => t.id !== id);
    await saveTasks(newTasks);
  }

  // ---- EXAM CALENDAR LOGIC ----
  async function addExam() {
    const subjectInput = document.getElementById('examSubject');
    const dateInput = document.getElementById('examDate');
    const subject = subjectInput.value.trim();
    const date = dateInput.value;
    if (!subject || !date) return;

    const newExams = [...exams, { subject, date, id: Date.now() }]
      .sort((a, b) => new Date(a.date) - new Date(b.date));

    subjectInput.value = '';
    dateInput.value = '';
    await saveExams(newExams);
  }

  function renderExams() {
    const examList = document.getElementById('examList');
    examList.innerHTML = '';
    document.getElementById('examCount').textContent = exams.length;

    if (exams.length === 0) {
      examList.innerHTML = `<li class="empty-state">No exams on the calendar yet.</li>`;
      return;
    }

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    exams.forEach(exam => {
      const examDate = new Date(exam.date);
      const diffDays = Math.ceil((examDate - today) / (1000 * 60 * 60 * 24));

      let countdownText = `${diffDays} days left`;
      let countdownClass = 'countdown-later';
      if (diffDays <= 0) { countdownText = 'Passed 💫'; countdownClass = 'countdown-past'; }
      if (diffDays === 0) { countdownText = 'Today! 🎯'; countdownClass = 'countdown-today'; }
      else if (diffDays > 0 && diffDays <= 3) { countdownClass = 'countdown-soon'; }

      const li = document.createElement('li');
      li.className = 'todo-item';
      li.innerHTML = `
        <div class="todo-left">
          <strong>${escapeHtml(exam.subject)}</strong>
          <small style="color: #888;">${exam.date}</small>
        </div>
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <span class="badge ${countdownClass}">${countdownText}</span>
          <button class="delete-btn" onclick="deleteExam(${exam.id})" aria-label="Delete exam">✖</button>
        </div>
      `;
      examList.appendChild(li);
    });
  }

  async function deleteExam(id) {
    const newExams = exams.filter(e => e.id !== id);
    await saveExams(newExams);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById('taskInput').addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
  document.getElementById('examSubject').addEventListener('keydown', e => { if (e.key === 'Enter') addExam(); });

  init();
</script>
</body>
</html>
